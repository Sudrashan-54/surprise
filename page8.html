<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lyrics Audio Scanner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Serif+Tamil:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#ffffff;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Poppins',sans-serif;
      padding:30px 0;
    }

    .mobile-shell{
      width:390px;
      min-height:844px;
      background:#ffffff;
      border-radius:48px;
      padding:34px 22px 30px;
      overflow:hidden;
      position:relative;

      box-shadow:
        0 20px 60px rgba(0,0,0,0.08),
        0 8px 24px rgba(0,0,0,0.05);

      border:1px solid rgba(0,0,0,0.05);
    }

    /* TOP BAR */

    .top-bar{
      display:flex;
      justify-content:flex-end;
      align-items:center;
      margin-bottom:24px;
    }

    .top-badge{
      background:linear-gradient(135deg,#162E93,#1A1953);
      color:#fff;
      padding:8px 18px;
      border-radius:999px;
      font-size:14px;
      font-weight:500;

      box-shadow:
        0 6px 18px rgba(22,46,147,.22);
    }

    /* LYRICS SECTION */

    .lyrics-box{

      background:
        radial-gradient(circle at top right,
        rgba(255,255,255,.16), transparent 30%),

        radial-gradient(circle at bottom left,
        rgba(255,255,255,.08), transparent 28%),

        linear-gradient(
          135deg,
          #162E93 0%,
          #2846bb 45%,
          #1A1953 100%
        );

      border-radius:34px;
      padding:30px 24px 28px;
      position:relative;
      overflow:hidden;

      margin-bottom:22px;

      min-height:220px;

      display:flex;
      align-items:center;

      box-shadow:
        0 18px 40px rgba(26,25,83,.22);
    }

    .lyrics-quote{
      position:absolute;
      top:6px;
      left:16px;

      font-size:78px;
      line-height:1;

      color:rgba(255,255,255,.10);

      font-family:Georgia,serif;
    }

    .lyrics-text{
      position:relative;
      z-index:2;

      width:100%;

      font-family:'Noto Serif Tamil',serif;

      font-size:21px;
      line-height:1.7;
      font-weight:500;

      color:#ffffff;

      text-align:left;

      word-break:break-word;
    }

    /* AUDIO CARD */

    .audio-card{
      background:#fff;
      border-radius:30px;

      padding:24px 18px 18px;

      margin-bottom:24px;

      box-shadow:
        0 10px 30px rgba(0,0,0,.06);

      border:1px solid rgba(0,0,0,.04);
    }

    .controls-row{
      display:flex;
      align-items:center;
      gap:16px;

      margin-bottom:18px;
    }

    .play-btn{
      width:64px;
      height:64px;

      border:none;
      border-radius:50%;

      cursor:pointer;

      background:
        linear-gradient(
          135deg,
          #4b63d0,
          #162E93
        );

      display:flex;
      justify-content:center;
      align-items:center;

      flex-shrink:0;

      transition:.2s;

      box-shadow:
        0 10px 24px rgba(22,46,147,.25);
    }

    .play-btn:hover{
      transform:scale(1.05);
    }

    .play-btn svg{
      fill:white;
    }

    /* WAVEFORM */

    .wave{
      display:flex;
      align-items:flex-end;
      gap:4px;

      flex:1;
      height:46px;
    }

    .bar{
      flex:1;
      border-radius:10px;

      background:rgba(22,46,147,.18);

      animation:idle 1.8s ease infinite;

      transform-origin:bottom;
    }

    .bar:nth-child(1){height:30%}
    .bar:nth-child(2){height:50%}
    .bar:nth-child(3){height:40%}
    .bar:nth-child(4){height:80%}
    .bar:nth-child(5){height:45%}
    .bar:nth-child(6){height:65%}
    .bar:nth-child(7){height:35%}
    .bar:nth-child(8){height:90%}
    .bar:nth-child(9){height:52%}
    .bar:nth-child(10){height:75%}
    .bar:nth-child(11){height:30%}
    .bar:nth-child(12){height:65%}
    .bar:nth-child(13){height:42%}
    .bar:nth-child(14){height:55%}

    @keyframes idle{

      0%,100%{
        transform:scaleY(1);
        opacity:.4;
      }

      50%{
        transform:scaleY(.65);
        opacity:.75;
      }

    }

    .wave.playing .bar{
      background:#3f5be0;
      animation:dance .45s ease infinite alternate;
    }

    @keyframes dance{

      from{
        transform:scaleY(.3);
      }

      to{
        transform:scaleY(1);
      }

    }

    /* PROGRESS */

    .progress-wrap{
      width:100%;
      height:6px;

      background:#e9ecff;

      border-radius:999px;

      overflow:hidden;

      cursor:pointer;

      margin-bottom:10px;
    }

    .progress{
      width:0%;
      height:100%;

      border-radius:999px;

      background:
        linear-gradient(
          90deg,
          #162E93,
          #4f68dc
        );

      position:relative;
    }

    .progress::after{
      content:'';

      position:absolute;

      right:-6px;
      top:50%;

      transform:translateY(-50%);

      width:14px;
      height:14px;

      border-radius:50%;

      background:#162E93;
    }

    .time-row{
      display:flex;
      justify-content:space-between;

      font-size:11px;
      font-weight:500;

      letter-spacing:.08em;

      color:#6873b8;
    }

    /* SCAN SECTION */

    .scan-label{
      display:flex;
      align-items:center;
      gap:8px;

      margin-bottom:14px;
      padding-left:4px;

      color:#6873b8;
      font-size:15px;
    }

    .scan-label svg{
      width:18px;
      height:18px;
    }

    .scan-btn{
      width:100%;
      height:72px;

      border:none;
      border-radius:28px;

      cursor:pointer;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #eef1ff 45%,
          #dfe5ff 100%
        );

      color:#243fa8;

      font-size:18px;
      font-weight:600;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;

      transition:.2s;

      box-shadow:
        0 10px 24px rgba(22,46,147,.08);
    }

    .scan-btn:hover{
      transform:translateY(-2px);
    }

    .scan-btn svg{
      width:28px;
      height:28px;
    }

    /* SCANNER OVERLAY */

    .scanner-overlay{
      position:absolute;
      inset:0;

      background:
        linear-gradient(
          135deg,
          #162E93,
          #1A1953
        );

      display:none;

      justify-content:center;
      align-items:center;
      flex-direction:column;

      border-radius:48px;

      z-index:20;

      animation:fadeIn .3s ease;
    }

    .scanner-overlay.open{
      display:flex;
    }

    @keyframes fadeIn{

      from{
        opacity:0;
      }

      to{
        opacity:1;
      }

    }

    .scan-overlay-title{
      color:rgba(255,255,255,.92);

      font-size:13px;
      letter-spacing:.2em;

      margin-bottom:28px;
    }

    .scanner-box{
      width:230px;
      height:230px;

      position:relative;

      margin-bottom:22px;
    }

    .corner{
      position:absolute;

      width:28px;
      height:28px;

      border-style:solid;
      border-color:#ffffff;
    }

    .corner.tl{
      top:0;
      left:0;

      border-width:4px 0 0 4px;
      border-radius:8px 0 0 0;
    }

    .corner.tr{
      top:0;
      right:0;

      border-width:4px 4px 0 0;
      border-radius:0 8px 0 0;
    }

    .corner.bl{
      bottom:0;
      left:0;

      border-width:0 0 4px 4px;
      border-radius:0 0 0 8px;
    }

    .corner.br{
      bottom:0;
      right:0;

      border-width:0 4px 4px 0;
      border-radius:0 0 8px 0;
    }

    .scan-inner{
      position:absolute;
      inset:0;

      border-radius:18px;
      overflow:hidden;

      background:rgba(255,255,255,.04);
    }

    .scan-grid{
      position:absolute;
      inset:0;

      background-image:
        linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);

      background-size:18px 18px;
    }

    .scan-line{
      position:absolute;

      left:0;
      right:0;

      height:4px;

      background:#7f9cff;

      box-shadow:
        0 0 12px #7f9cff,
        0 0 24px rgba(127,156,255,.7);

      animation:scanline 2s ease-in-out infinite;
    }

    @keyframes scanline{

      0%{
        top:0%;
      }

      100%{
        top:100%;
      }

    }

    .scan-hint{
      color:rgba(255,255,255,.88);

      font-size:14px;
      letter-spacing:.08em;

      margin-bottom:28px;
    }

    .close-btn{
      border:none;

      background:rgba(255,255,255,.14);

      color:white;

      padding:14px 42px;

      border-radius:999px;

      font-size:18px;
      font-weight:600;

      cursor:pointer;

      backdrop-filter:blur(8px);

      border:1px solid rgba(255,255,255,.22);
    }

  </style>
</head>

<body>

  <div class="mobile-shell">

    <!-- TOP -->

    <div class="top-bar">

      <div class="top-badge">
        💗 Sana
      </div>

    </div>

    <!-- LYRICS -->

    <div class="lyrics-box">

      <div class="lyrics-quote">“</div>

      <div class="lyrics-text">

        எந்த பக்கம் நிற்கின்றாயோ<br>
        அந்த பக்கம் கண்கள் போகும் முன்னும்<br><br>

        பின்னும் நீ நடந்தால்<br>
        ஊஞ்சல் ஆடும்

      </div>

    </div>

    <!-- AUDIO CARD -->

    <div class="audio-card">

      <div class="controls-row">

        <button class="play-btn" id="playBtn" onclick="togglePlay()">

          <svg id="playIcon"
            width="18"
            height="18"
            viewBox="0 0 16 16">

            <polygon points="4,2 14,8 4,14"/>

          </svg>

        </button>

        <div class="wave" id="waveform">

          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>

        </div>

      </div>

      <!-- AUDIO -->

      <audio id="audio">
        <source src="./songs/entha pakkam nikrintrayo.mpeg" type="audio/mp3">
      </audio>

      <!-- PROGRESS -->

      <div class="progress-wrap" id="progressWrap">

        <div class="progress" id="progress"></div>

      </div>

      <!-- TIME -->

      <div class="time-row">

        <span id="elapsed">0:00</span>

        <span id="audioDuration">0:00</span>

      </div>

    </div>

    <!-- SCAN -->

    <div class="scan-section">

      <div class="scan-label">

        <svg viewBox="0 0 24 24"
          fill="none"
          stroke="#6873b8"
          stroke-width="2"
          stroke-linecap="round">

          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>

        </svg>

        Scan the next paper to continue

      </div>

      <button class="scan-btn" id="scanBtn">

        <svg viewBox="0 0 24 24"
          fill="none"
          stroke="#243fa8"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">

          <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/>

          <line x1="7" y1="12" x2="17" y2="12"/>

        </svg>

        Scan next page

      </button>

    </div>

    <!-- SCANNER -->

    <div class="scanner-overlay" id="scanner">

      <div class="scan-overlay-title">
        ALIGN PAPER WITHIN FRAME
      </div>

      <div class="scanner-box">

        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="scan-inner">

          <div class="scan-grid"></div>

          <div class="scan-line"></div>
          <div id="qr-reader" style="width: 210px; height: 210px; margin: 0 auto;"></div>

        </div>

      </div>

      <div class="scan-hint" id="scanHint">
        Hold steady · Auto-detects QR
      </div>

      <button class="close-btn" id="closeBtn">
        Done
      </button>

    </div>

  </div>

  <!-- html5-qrcode CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.10/html5-qrcode.min.js"></script>
  <script>

    let isPlaying = false;
    let interval = null;

    const audio = document.getElementById('audio');
    const playIcon = document.getElementById('playIcon');
    const waveform = document.getElementById('waveform');
    const progress = document.getElementById('progress');
    const elapsed = document.getElementById('elapsed');
    const durationEl = document.getElementById('audioDuration');
    const progressWrap = document.getElementById('progressWrap');

    function fmt(s){

      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);

      return m + ':' + (sec < 10 ? '0' : '') + sec;

    }

    function setIcon(playing){

      if(playing){

        playIcon.innerHTML =
          '<rect x="3" y="2" width="4" height="12" rx="1"/>' +
          '<rect x="9" y="2" width="4" height="12" rx="1"/>';

      } else {

        playIcon.innerHTML =
          '<polygon points="4,2 14,8 4,14"/>';

      }

    }

    audio.addEventListener('loadedmetadata', () => {

      durationEl.textContent = fmt(audio.duration);

    });

    function togglePlay(){

      if(!isPlaying){

        isPlaying = true;

        waveform.classList.add('playing');

        setIcon(true);

        audio.play().catch(() => {});

        interval = setInterval(() => {

          if(audio.duration){

            const pct =
              (audio.currentTime / audio.duration) * 100;

            progress.style.width = pct + '%';

            elapsed.textContent =
              fmt(audio.currentTime);

          }

        },200);

        audio.onended = () => resetPlayer();

      } else {

        pausePlayer();

      }

    }

    function pausePlayer(){

      isPlaying = false;

      waveform.classList.remove('playing');

      setIcon(false);

      audio.pause();

      clearInterval(interval);

    }

    function resetPlayer(){

      pausePlayer();

      progress.style.width = '0%';

      elapsed.textContent = '0:00';

    }

    progressWrap.addEventListener('click', function(e){

      if(!audio.duration) return;

      const rect = this.getBoundingClientRect();

      const pct =
        Math.max(
          0,
          Math.min(
            1,
            (e.clientX - rect.left) / rect.width
          )
        );

      audio.currentTime = pct * audio.duration;

      progress.style.width = (pct * 100) + '%';

      elapsed.textContent = fmt(audio.currentTime);

    });

    // QR Scanner integration
    const scannerOverlay = document.getElementById('scanner');
    const scanBtn = document.getElementById('scanBtn');
    const closeBtn = document.getElementById('closeBtn');
    const scanHint = document.getElementById('scanHint');
    const qrReader = document.getElementById('qr-reader');
    let html5QrCode = null;
    let fallbackStream = null;
    let fallbackVideo = null;
    let fallbackRaf = null;
    let fallbackDetector = null;

    if ('BarcodeDetector' in window) {
      try {
        fallbackDetector = new BarcodeDetector({ formats: ['qr_code'] });
      } catch (_e) {}
    }

    function stopFallbackScanner() {
      if (fallbackRaf) {
        cancelAnimationFrame(fallbackRaf);
        fallbackRaf = null;
      }
      if (fallbackStream) {
        fallbackStream.getTracks().forEach(track => track.stop());
        fallbackStream = null;
      }
      if (qrReader) {
        qrReader.innerHTML = '';
      }
      fallbackVideo = null;
    }

    async function startFallbackScanner() {
      if (!fallbackDetector) {
        scanHint.textContent = 'Scanner unavailable on this browser.';
        return;
      }

      stopFallbackScanner();
      fallbackVideo = document.createElement('video');
      fallbackVideo.setAttribute('playsinline', 'true');
      fallbackVideo.muted = true;
      fallbackVideo.style.width = '100%';
      fallbackVideo.style.height = '100%';
      qrReader.innerHTML = '';
      qrReader.appendChild(fallbackVideo);

      try {
        fallbackStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }
        });
      } catch (err) {
        scanHint.textContent = 'Camera error: ' + (err && err.message ? err.message : err);
        return;
      }

      fallbackVideo.srcObject = fallbackStream;
      await fallbackVideo.play();
      scanHint.textContent = 'Hold steady · Auto-detects QR';

      const tick = async () => {
        if (!fallbackVideo) {
          return;
        }
        try {
          const codes = await fallbackDetector.detect(fallbackVideo);
          if (codes && codes.length && codes[0].rawValue) {
            scanHint.textContent = 'QR detected! Redirecting...';
            const target = codes[0].rawValue;
            stopFallbackScanner();
            window.location.href = target;
            return;
          }
        } catch (_e) {}
        fallbackRaf = requestAnimationFrame(tick);
      };

      fallbackRaf = requestAnimationFrame(tick);
    }

    scanBtn.addEventListener('click', () => {
      scannerOverlay.classList.add('open');

      if (typeof Html5Qrcode === 'undefined') {
        startFallbackScanner();
        return;
      }

      stopFallbackScanner();
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode('qr-reader');
      }
      scanHint.textContent = 'Hold steady · Auto-detects QR';

      html5QrCode.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: { width: 180, height: 180 } },
        qrCodeMessage => {
          scanHint.textContent = 'QR detected! Redirecting...';
          html5QrCode.stop().then(() => {
            window.location.href = qrCodeMessage;
          });
        },
        _errorMessage => {}
      ).catch(err => {
        scanHint.textContent = 'Camera error: ' + (err && err.message ? err.message : err);
      });
    });

    closeBtn.addEventListener('click', () => {
      scannerOverlay.classList.remove('open');
      stopFallbackScanner();
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {});
      }
    });

  </script>

</body>
</html>
