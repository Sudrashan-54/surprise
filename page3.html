<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrics Audio Scanner UI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Serif+Tamil:wght@400;500&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#ececf3;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Poppins',sans-serif;
    }

    .mobile{
      width:390px;
      height:844px;
      background:#f0f0f5;
      padding:24px;
      overflow:auto;
    }

    /* LYRICS */

    .lyrics-box{
      background:#6f0000;
      color:#fff;
      border-radius:28px;
      padding:38px 28px;
      line-height:1.4;
      font-size:29px;
      font-family:'Noto Serif Tamil', serif;
      box-shadow:0 10px 30px rgba(0,0,0,0.12);
      margin-bottom:28px;
    }

    /* AUDIO CARD */

    .audio-card{
      width:100%;
      display:flex;
      align-items:center;
      gap:14px;

      padding:16px;
      border-radius:28px;

      background:
      linear-gradient(145deg,#fff,#fff5f7);

      border:1px solid rgba(217,28,60,0.12);

      box-shadow:
      0 8px 28px rgba(217,28,60,0.08),
      inset 0 1px 0 rgba(255,255,255,0.8);

      overflow:hidden;
      position:relative;

      margin-bottom:28px;
    }

    .audio-card::before{
      content:'';
      position:absolute;
      inset:0;

      background:
      radial-gradient(circle at top right,
      rgba(217,28,60,0.05),
      transparent 45%);

      pointer-events:none;
    }

    /* PLAY BUTTON */

    .play-btn{
      width:58px;
      height:58px;
      border:none;
      border-radius:50%;

      flex-shrink:0;

      background:
      linear-gradient(
      135deg,
      #D91C3C,
      #A81030
      );

      display:flex;
      justify-content:center;
      align-items:center;

      cursor:pointer;

      box-shadow:
      0 10px 24px rgba(217,28,60,0.35);

      transition:.3s ease;
    }

    .play-btn:hover{
      transform:scale(1.06);
    }

    .play-btn:active{
      transform:scale(.92);
    }

    .play-btn .icon{
      width:0;
      height:0;

      border-style:solid;
      border-width:9px 0 9px 14px;

      border-color:
      transparent
      transparent
      transparent
      white;

      margin-left:4px;
    }

    .play-btn.playing .icon{
      border:none;

      width:14px;
      height:15px;

      background:
      linear-gradient(
      to right,
      white 4px,
      transparent 4px,
      transparent 9px,
      white 9px
      );

      margin-left:0;
    }

    /* CONTENT */

    .audio-content{
      flex:1;
    }

    /* SONG INFO */

    .song-info{
      display:flex;
      flex-direction:column;
      margin-bottom:10px;
    }

    .song-name{
      font-size:14px;
      font-weight:600;
      color:#2b0208;
    }

    .artist-name{
      font-size:11px;
      color:rgba(217,28,60,0.6);
      letter-spacing:.1em;
    }

    /* WAVEFORM */

    .wave{
      display:flex;
      align-items:flex-end;
      gap:3px;
      height:34px;
      margin-bottom:12px;
    }

    .bar{
      width:4px;
      border-radius:20px;

      background:
      rgba(217,28,60,0.25);

      animation:idle 1.5s ease infinite;
    }

    .bar:nth-child(1){height:25%;}
    .bar:nth-child(2){height:70%;}
    .bar:nth-child(3){height:40%;}
    .bar:nth-child(4){height:85%;}
    .bar:nth-child(5){height:45%;}
    .bar:nth-child(6){height:65%;}
    .bar:nth-child(7){height:28%;}
    .bar:nth-child(8){height:80%;}
    .bar:nth-child(9){height:50%;}
    .bar:nth-child(10){height:90%;}
    .bar:nth-child(11){height:35%;}
    .bar:nth-child(12){height:75%;}

    @keyframes idle{

      0%,100%{
        opacity:.35;
        transform:scaleY(1);
      }

      50%{
        opacity:.6;
        transform:scaleY(.8);
      }
    }

    .playing .bar{
      animation:dance .5s ease infinite alternate;
      background:#D91C3C;
    }

    @keyframes dance{

      from{
        transform:scaleY(.35);
        opacity:.5;
      }

      to{
        transform:scaleY(1);
        opacity:1;
      }
    }

    /* PROGRESS */

    .progress-wrap{
      width:100%;
      height:4px;
      border-radius:20px;

      overflow:hidden;

      background:
      rgba(217,28,60,0.12);

      margin-bottom:10px;
    }

    .progress{
      width:0%;
      height:100%;

      border-radius:20px;

      background:
      linear-gradient(
      90deg,
      #D91C3C,
      #FF4060
      );

      transition:.2s linear;
    }

    /* TIME */

    .time-row{
      display:flex;
      justify-content:space-between;
    }

    .time{
      font-size:10px;
      letter-spacing:.08em;
      color:rgba(217,28,60,0.55);
    }

    /* SCAN */

    .scan-text{
      font-size:17px;
      color:#4d4d73;
      margin-bottom:20px;
      padding-left:8px;
    }

    .scan-btn{
      width:100%;
      height:66px;
      border:none;
      border-radius:22px;
      background:#ececf3;

      box-shadow:
      8px 8px 18px rgba(0,0,0,0.08),
      -8px -8px 18px rgba(255,255,255,0.9);

      font-size:17px;
      color:#27304f;

      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;

      cursor:pointer;
      font-weight:500;
    }

    /* SCANNER */

    .scanner{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.85);

      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;

      z-index:99;
    }

    .scanner-box{
      width:240px;
      height:240px;
      border:4px solid #00ff9d;
      border-radius:18px;

      position:relative;
      overflow:hidden;
    }

    .line{
      position:absolute;
      width:100%;
      height:4px;

      background:#00ff9d;
      box-shadow:0 0 12px #00ff9d;

      animation:scan 2s linear infinite;
    }

    @keyframes scan{
      from{
        top:0;
      }
      to{
        top:100%;
      }
    }

    .close{
      margin-top:28px;
      padding:12px 30px;
      border:none;
      border-radius:40px;
      font-size:16px;
      cursor:pointer;
    }

  </style>
</head>

<body>

  <div class="mobile">

    <!-- LYRICS -->

    <div class="lyrics-box">
      Oppanaigal edhumatra <br>
      உந்தன் இயல்பும் <br>
      karpanaiyil aazhthugindra <br>
      kallacchirippum <br>
      இன்னும் வேண்டும் சொல்லும் <br>
      குட்டி kurumbum <br>
      காலம் ulla kaalam varai <br>
      nenjil இனிக்கும்.!! 💗
    </div>

    <!-- AUDIO CARD -->

    <div class="audio-card">

      <button class="play-btn" onclick="togglePlay(this)">
        <span class="icon"></span>
      </button>

      <div class="audio-content">

       

        <div class="wave waveform">

          <audio>
            <source src="./songs/oppanaikal.mpeg" type="audio/mp3">
          </audio>

          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>

        </div>

        <div class="progress-wrap">
          <div class="progress"></div>
        </div>

        <div class="time-row">
          <span class="time elapsed">0:00</span>
          <span class="time duration">0:00</span>
        </div>

      </div>

    </div>

    <!-- SCAN TEXT -->

    <div class="scan-text">
      Scan the next paper to continue 💗
    </div>

    <!-- BUTTON -->

    <button class="scan-btn" id="scanBtn">
      ⌲ Scan next
    </button>

  </div>

  <!-- SCANNER -->

  <div class="scanner" id="scanner">

    <div class="scanner-box">
      <div class="line"></div>
    </div>

    <button class="close" id="closeBtn">
      Close Scanner
    </button>

  </div>

  <script>

    function togglePlay(btn){

      const card =
      btn.closest('.audio-card');

      const audio =
      card.querySelector('audio');

      const waveform =
      card.querySelector('.waveform');

      const elapsed =
      card.querySelector('.elapsed');

      const duration =
      card.querySelector('.duration');

      const progress =
      card.querySelector('.progress');

      // LOAD DURATION

      audio.onloadedmetadata = ()=>{

        let mins =
        Math.floor(audio.duration / 60);

        let secs =
        Math.floor(audio.duration % 60);

        if(secs < 10){
          secs = '0' + secs;
        }

        duration.textContent =
        mins + ':' + secs;
      };

      if(!btn.classList.contains('playing')){

        btn.classList.add('playing');

        waveform.classList.add('playing');

        audio.play();

        btn.interval =
        setInterval(()=>{

          if(audio.duration){

            const percent =
            (audio.currentTime /
            audio.duration) * 100;

            progress.style.width =
            percent + '%';

            let mins =
            Math.floor(audio.currentTime / 60);

            let secs =
            Math.floor(audio.currentTime % 60);

            if(secs < 10){
              secs = '0' + secs;
            }

            elapsed.textContent =
            mins + ':' + secs;
          }

        },200);

        audio.onended = ()=>{

          btn.classList.remove('playing');

          waveform.classList.remove('playing');

          progress.style.width = '0%';

          elapsed.textContent = '0:00';

          clearInterval(btn.interval);
        };

      }else{

        btn.classList.remove('playing');

        waveform.classList.remove('playing');

        audio.pause();

        clearInterval(btn.interval);
      }
    }

    // SCANNER

    const scanBtn =
    document.getElementById('scanBtn');

    const scanner =
    document.getElementById('scanner');

    const closeBtn =
    document.getElementById('closeBtn');

    scanBtn.addEventListener('click', ()=>{

      scanner.style.display = 'flex';

    });

    closeBtn.addEventListener('click', ()=>{

      scanner.style.display = 'none';

    });

  </script>

</body>
</html>
