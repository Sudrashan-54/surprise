<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrics Audio Scanner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Serif+Tamil:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }

    /* ── SHELL ── */
    .mobile-shell {
      width: 390px;
      min-height: 844px;
      background: #ffffff;
      border-radius: 48px;
      padding: 36px 22px 32px;
      overflow: hidden;
      position: relative;
      box-shadow:
        20px 20px 60px rgba(0,0,0,0.12),
        -8px -8px 24px rgba(255,255,255,0.9);
    }

    /* ── TOP BAR ── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .top-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .14em;
      color: #888888;
      text-transform: uppercase;
    }
    .top-badge {
      background: #111111;
      color: #ffd600;
      font-size: 10px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: .07em;
      border: 1px solid rgba(255,214,0,0.2);
    }

    /* ── LYRICS BOX ── */
    .lyrics-box {
      background: linear-gradient(145deg, #111111 0%, #1a1a1a 100%);
      color: #fff;
      border-radius: 26px;
      padding: 30px 26px 26px;
      line-height: 1.75;
      font-size: 19px;
      font-family: 'Noto Serif Tamil', serif;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,214,0,0.12);
    }
    .lyrics-box::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(255,214,0,0.04);
    }
    .lyrics-box::after {
      content: '';
      position: absolute;
      bottom: -25px; left: 10px;
      width: 100px; height: 100px;
      border-radius: 50%;
      background: rgba(255,214,0,0.03);
    }
    .lyrics-quote {
      position: absolute;
      top: 10px; left: 18px;
      font-size: 64px;
      font-family: Georgia, serif;
      color: rgba(255,214,0,0.08);
      line-height: 1;
      user-select: none;
    }
    .lyrics-text {
      position: relative;
      z-index: 1;
      color: #ffd600;
    }
    .lyrics-text .line-hi {
      color: #ffffff;
      font-weight: 500;
    }

    /* ── AUDIO CARD ── */
    .audio-card {
      background: #111111;
      border-radius: 24px;
      padding: 18px 16px 16px;
      margin-bottom: 18px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    /* Song info */
    .song-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .album-art {
      width: 46px; height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3a3000, #ffd600);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .album-art svg {
      width: 20px; height: 20px;
      fill: rgba(0,0,0,0.8);
    }
    .song-meta { flex: 1; }
    .song-name {
      font-size: 13px;
      font-weight: 600;
      color: #ffd600;
      margin: 0 0 2px;
    }
    .artist-name {
      font-size: 11px;
      color: #888888;
      letter-spacing: .06em;
      margin: 0;
    }

    /* Controls */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .play-btn {
      width: 48px; height: 48px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffd600, #b89a00);
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 6px 18px rgba(255,214,0,0.3);
      transition: transform .2s, box-shadow .2s;
    }
    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 24px rgba(255,214,0,0.45);
    }
    .play-btn:active {
      transform: scale(.92);
      box-shadow: 0 3px 10px rgba(255,214,0,0.2);
    }
    .play-btn svg { fill: #111111; }

    /* Waveform */
    .wave {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 34px;
      flex: 1;
    }
    .bar {
      flex: 1;
      border-radius: 10px;
      background: rgba(255,214,0,0.15);
      animation: idle 1.8s ease infinite;
      transform-origin: bottom;
    }
    .bar:nth-child(1)  { height:30%; animation-delay: 0s; }
    .bar:nth-child(2)  { height:65%; animation-delay: .1s; }
    .bar:nth-child(3)  { height:45%; animation-delay: .2s; }
    .bar:nth-child(4)  { height:90%; animation-delay: .05s; }
    .bar:nth-child(5)  { height:50%; animation-delay: .15s; }
    .bar:nth-child(6)  { height:72%; animation-delay: .25s; }
    .bar:nth-child(7)  { height:30%; animation-delay: .08s; }
    .bar:nth-child(8)  { height:85%; animation-delay: .18s; }
    .bar:nth-child(9)  { height:55%; animation-delay: .3s; }
    .bar:nth-child(10) { height:95%; animation-delay: .12s; }
    .bar:nth-child(11) { height:38%; animation-delay: .22s; }
    .bar:nth-child(12) { height:78%; animation-delay: .06s; }
    .bar:nth-child(13) { height:42%; animation-delay: .16s; }
    .bar:nth-child(14) { height:62%; animation-delay: .26s; }

    @keyframes idle {
      0%,100% { opacity:.25; transform:scaleY(1); }
      50%      { opacity:.45; transform:scaleY(.65); }
    }

    .wave.playing .bar {
      animation: dance .45s ease infinite alternate;
      background: #ffd600;
    }
    @keyframes dance {
      from { transform:scaleY(.3); opacity:.5; }
      to   { transform:scaleY(1); opacity:1; }
    }

    /* Progress */
    .progress-wrap {
      width: 100%;
      height: 4px;
      border-radius: 20px;
      background: rgba(255,214,0,0.1);
      margin-bottom: 8px;
      cursor: pointer;
      position: relative;
    }
    .progress-wrap:hover .progress-thumb { opacity: 1; }
    .progress {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #ffd600, #ffe566);
      width: 0%;
      transition: width .2s linear;
      position: relative;
    }
    .progress-thumb {
      position: absolute;
      right: -6px; top: -4px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ffd600;
      opacity: 0;
      transition: opacity .2s;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: .06em;
      color: rgba(0,0,0,0.35);
    }

    /* ── SCAN SECTION ── */
    .scan-section { margin-top: 2px; }

    .scan-label {
      font-size: 13px;
      color: #555555;
      margin-bottom: 12px;
      padding-left: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .scan-label svg { width: 15px; height: 15px; flex-shrink: 0; }

    .scan-btn {
      width: 100%;
      height: 62px;
      border: none;
      border-radius: 20px;
      background: #111111;
      box-shadow:
        7px 7px 16px rgba(0,0,0,0.08),
        -2px -2px 8px rgba(255,214,0,0.06);
      border: 1px solid rgba(255,214,0,0.12);
      font-size: 15px;
      font-weight: 500;
      color: #ffd600;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: box-shadow .2s, transform .15s, border-color .2s;
    }
    .scan-btn:hover {
      box-shadow:
        9px 9px 20px rgba(0,0,0,0.1),
        -2px -2px 10px rgba(255,214,0,0.1);
      border-color: rgba(255,214,0,0.28);
    }
    .scan-btn:active {
      transform: scale(.98);
    }
    .scan-btn svg { width: 20px; height: 20px; }

    /* ── SCANNER OVERLAY ── */
    .scanner-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10,10,10,0.96);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 20;
      border-radius: 48px;
      animation: fadeIn .25s ease;
    }
    .scanner-overlay.open { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .scan-overlay-title {
      color: rgba(255,214,0,0.5);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .scanner-box {
      width: 220px; height: 220px;
      border-radius: 18px;
      position: relative;
      margin-bottom: 20px;
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 24px; height: 24px;
      border-color: #ffd600;
      border-style: solid;
    }
    .corner.tl { top:0; left:0;   border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
    .corner.tr { top:0; right:0;  border-width: 3px 3px 0 0; border-radius: 0 6px 0 0; }
    .corner.bl { bottom:0; left:0;  border-width: 0 0 3px 3px; border-radius: 0 0 0 6px; }
    .corner.br { bottom:0; right:0; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }

    .scan-inner {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,214,0,0.015);
    }

    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: #ffd600;
      box-shadow: 0 0 10px #ffd600, 0 0 30px rgba(255,214,0,0.35);
      animation: scanline 2.2s ease-in-out infinite;
    }
    .scan-line::before {
      content: '';
      position: absolute;
      inset: 0;
      top: -20px;
      height: 22px;
      background: linear-gradient(to top, rgba(255,214,0,0.08), transparent);
    }
    @keyframes scanline {
      0%   { top: 0%;   opacity:1; }
      88%  { top: 100%; opacity:1; }
      100% { top: 100%; opacity:0; }
    }

    .scan-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,214,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,214,0,0.03) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .scan-hint {
      color: rgba(255,214,0,0.3);
      font-size: 11px;
      letter-spacing: .1em;
      margin-bottom: 32px;
    }

    .close-btn {
      padding: 12px 36px;
      border: 1.5px solid rgba(255,214,0,0.25);
      background: rgba(255,214,0,0.07);
      border-radius: 40px;
      color: rgba(255,214,0,0.8);
      font-size: 14px;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .close-btn:hover {
      background: rgba(255,214,0,0.14);
      border-color: rgba(0,0,0,0.35);
    }
    .close-btn:active { transform: scale(.96); }
  </style>
</head>

<body>

  <div class="mobile-shell" id="shell">

    <!-- TOP BAR -->
    <div class="top-bar">
      <span class="top-label"></span>
      <span class="top-badge">Sana</span>
    </div>

    <!-- LYRICS -->
    <div class="lyrics-box">
      <span class="lyrics-quote">"</span>
      <div class="lyrics-text">
        <span class="line-hi">பதில் நானும் தரும் முன்பே</span><br>
        கனவாகி கலைந்தாய்<br>
        <span class="line-hi">பிடிவாதம் பிடி</span><br>
        சினம் தீரும் அடி<br>
        <span class="line-hi">இழந்தோம் எழில்கோலம்</span><br>
        இனிமேல் மழைக்காலம் 🌧️
      </div>
    </div>

    <!-- AUDIO CARD -->
    <div class="audio-card">

      <div class="song-row">
        
        
      </div>

      <!-- Controls + waveform -->
      <div class="controls-row">
        <button class="play-btn" id="playBtn" onclick="togglePlay()" aria-label="Play or pause">
          <svg id="playIcon" width="16" height="16" viewBox="0 0 16 16">
            <polygon points="4,2 14,8 4,14"/>
          </svg>
        </button>

        <div class="wave" id="waveform">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div><div class="bar"></div>
          <div class="bar"></div><div class="bar"></div>
        </div>
      </div>

      <!-- Hidden audio element -->
      <audio id="audio">
        <source src="songs/maruvarthai.mpeg" type="audio/mp3">
      </audio>

      <!-- Progress bar -->
      <div class="progress-wrap" id="progressWrap">
        <div class="progress" id="progress">
          <div class="progress-thumb"></div>
        </div>
      </div>

      <!-- Time -->
      <div class="time-row">
        <span id="elapsed">0:00</span>
        <span id="audioDuration">0:00</span>
      </div>

    </div>

    <!-- SCAN SECTION -->
    <div class="scan-section">
      <div class="scan-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="#555555" stroke-width="2" stroke-linecap="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        Scan the next paper to continue
      </div>

      <button class="scan-btn" id="scanBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffd600" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/>
          <line x1="7" y1="12" x2="17" y2="12"/>
        </svg>
        Scan next page
      </button>
    </div>

    <!-- SCANNER OVERLAY -->
    <div class="scanner-overlay" id="scanner">

      <div class="scan-overlay-title">Align paper within frame</div>

      <div class="scanner-box">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>
        <div class="scan-inner">
          <div class="scan-grid"></div>
          <div class="scan-line"></div>
        </div>
      </div>

      <div class="scan-hint">Hold steady · Auto-detects lyrics</div>

      <button class="close-btn" id="closeBtn">Done</button>

    </div>

  </div>

  <script>
    let isPlaying = false;
    let interval  = null;

    const audio       = document.getElementById('audio');
    const playIcon    = document.getElementById('playIcon');
    const waveform    = document.getElementById('waveform');
    const progress    = document.getElementById('progress');
    const elapsed     = document.getElementById('elapsed');
    const durationEl  = document.getElementById('audioDuration');
    const progressWrap= document.getElementById('progressWrap');

    function fmt(s) {
      const m   = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function setIcon(playing) {
      if (playing) {
        playIcon.innerHTML =
          '<rect x="3" y="2" width="4" height="12" rx="1"/>' +
          '<rect x="9" y="2" width="4" height="12" rx="1"/>';
      } else {
        playIcon.innerHTML = '<polygon points="4,2 14,8 4,14"/>';
      }
    }

    audio.addEventListener('loadedmetadata', () => {
      durationEl.textContent = fmt(audio.duration);
    });

    function togglePlay() {
      if (!isPlaying) {
        isPlaying = true;
        waveform.classList.add('playing');
        setIcon(true);
        audio.play().catch(() => {});

        interval = setInterval(() => {
          if (audio.duration) {
            const pct = (audio.currentTime / audio.duration) * 100;
            progress.style.width = pct + '%';
            elapsed.textContent  = fmt(audio.currentTime);
          }
        }, 200);

        audio.onended = () => resetPlayer();
      } else {
        pausePlayer();
      }
    }

    function pausePlayer() {
      isPlaying = false;
      waveform.classList.remove('playing');
      setIcon(false);
      audio.pause();
      clearInterval(interval);
    }

    function resetPlayer() {
      pausePlayer();
      progress.style.width = '0%';
      elapsed.textContent  = '0:00';
    }

    progressWrap.addEventListener('click', function(e) {
      if (!audio.duration) return;
      const rect = this.getBoundingClientRect();
      const pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      audio.currentTime    = pct * audio.duration;
      progress.style.width = (pct * 100) + '%';
      elapsed.textContent  = fmt(audio.currentTime);
    });

    document.getElementById('scanBtn').addEventListener('click', () => {
      document.getElementById('scanner').classList.add('open');
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      document.getElementById('scanner').classList.remove('open');
    });
  </script>

</body>
</html>
