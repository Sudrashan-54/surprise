<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrics Audio Scanner UI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Serif+Tamil:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#ececf3;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Poppins',sans-serif;
    }

    .mobile{
      width:390px;
      height:844px;
      background:#f0f0f5;
      padding:24px;
      overflow:auto;
    }

    .lyrics-box{
      background:#6f0000;
      color:#fff;
      border-radius:28px;
      padding:38px 28px;
      line-height:1.4;
      font-size:29px;
      font-family:'Noto Serif Tamil', serif;
      box-shadow:0 10px 30px rgba(0,0,0,0.12);
      margin-bottom:28px;
    }

    .audio-card{
      background:#ececf3;
      border-radius:28px;
      padding:26px;
      box-shadow:
      10px 10px 20px rgba(0,0,0,0.08),
      -10px -10px 20px rgba(255,255,255,0.9);
      margin-bottom:28px;
    }

    .play-btn{
      width:80px;
      height:80px;
      border-radius:50%;
      border:none;
      background:#ececf3;
      box-shadow:
      8px 8px 18px rgba(0,0,0,0.08),
      -8px -8px 18px rgba(255,255,255,0.9);
      display:flex;
      justify-content:center;
      align-items:center;
      margin:0 auto 24px;
      cursor:pointer;
      font-size:28px;
      color:#4d4d73;
    }

    .progress{
      width:100%;
      height:5px;
      border-radius:10px;
      background:#cfcfe0;
      overflow:hidden;
      margin-bottom:10px;
    }

    .progress-bar{
      width:0%;
      height:100%;
      background:#6f0000;
    }

    .time-row{
      display:flex;
      justify-content:space-between;
      color:#6d6d8b;
      font-size:14px;
    }

    .scan-text{
      font-size:17px;
      color:#4d4d73;
      margin-bottom:20px;
      padding-left:8px;
    }

    .scan-btn{
      width:100%;
      height:66px;
      border:none;
      border-radius:22px;
      background:#ececf3;
      box-shadow:
      8px 8px 18px rgba(0,0,0,0.08),
      -8px -8px 18px rgba(255,255,255,0.9);
      font-size:17px;
      color:#27304f;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
      cursor:pointer;
      font-weight:500;
    }

    .scanner{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.85);
      display:none;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:99;
    }

    .scanner-box{
      width:240px;
      height:240px;
      border:4px solid #00ff9d;
      border-radius:18px;
      position:relative;
      overflow:hidden;
    }

    .line{
      position:absolute;
      width:100%;
      height:4px;
      background:#00ff9d;
      box-shadow:0 0 12px #00ff9d;
      animation:scan 2s linear infinite;
    }

    @keyframes scan{
      from{top:0;}
      to{top:100%;}
    }

    .close{
      margin-top:28px;
      padding:12px 30px;
      border:none;
      border-radius:40px;
      font-size:16px;
      cursor:pointer;
    }
  </style>
</head>
<body>

<div class="mobile">

  <div class="lyrics-box">
    Oppanaigal edhumatra <br>
    உந்தன் இயல்பும் <br>
    karpanaiyil aazhthugindra <br>
    kallacchirippum <br>
    இன்னும் வேண்டும் சொல்லும் <br>
    குட்டி kurumbum <br>
    காலம் ulla kaalam varai <br>
    nenjil இனிக்கும்.!! 💗
  </div>

  <div class="audio-card">

    <button class="play-btn" id="playBtn">▶</button>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="time-row">
      <span id="current">0:00</span>
      <span id="duration">--</span>
    </div>

    <audio id="audio">
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

  </div>

  <div class="scan-text">
    Scan the next paper to continue 💗
  </div>

  <button class="scan-btn" id="scanBtn">
    ⌲ Scan next
  </button>

</div>

<div class="scanner" id="scanner">
  <div class="scanner-box">
    <div class="line"></div>
  </div>

  <button class="close" id="closeBtn">Close Scanner</button>
</div>

<script>

const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const progressBar = document.getElementById('progressBar');
const current = document.getElementById('current');
const duration = document.getElementById('duration');

playBtn.addEventListener('click', ()=>{

  if(audio.paused){
    audio.play();
    playBtn.innerHTML = '❚❚';
  }else{
    audio.pause();
    playBtn.innerHTML = '▶';
  }

});

audio.addEventListener('timeupdate', ()=>{

  const progress = (audio.currentTime / audio.duration) * 100;
  progressBar.style.width = progress + '%';

  let mins = Math.floor(audio.currentTime / 60);
  let secs = Math.floor(audio.currentTime % 60);

  if(secs < 10) secs = '0' + secs;

  current.innerHTML = mins + ':' + secs;

  let dmins = Math.floor(audio.duration / 60) || 0;
  let dsecs = Math.floor(audio.duration % 60) || 0;

  if(dsecs < 10) dsecs = '0' + dsecs;

  duration.innerHTML = dmins + ':' + dsecs;

});

const scanBtn = document.getElementById('scanBtn');
const scanner = document.getElementById('scanner');
const closeBtn = document.getElementById('closeBtn');

scanBtn.addEventListener('click', ()=>{
  scanner.style.display = 'flex';
});

closeBtn.addEventListener('click', ()=>{
  scanner.style.display = 'none';
});

</script>

</body>
</html>
