<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lyrics Audio Scanner</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      padding: 20px;
    }

    /* Mobile Shell */
    .mobile-shell {
      width: 390px;
      min-height: 844px;
      background: #ffffff;
      border-radius: 48px;
      padding: 36px 22px 32px;
      overflow: hidden;
      position: relative;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.12),
        0 8px 24px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .top-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .14em;
      color: #888;
      text-transform: uppercase;
    }

    .top-badge {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      letter-spacing: .07em;
      box-shadow: 0 4px 12px rgba(37,99,235,0.25);
    }

    /* Lyrics Section */
    .lyrics-box {
      background: linear-gradient(
        135deg,
        #2563eb 0%,
        #3b82f6 35%,
        #60a5fa 100%
      );
      color: #fff;
      border-radius: 28px;
      padding: 30px 26px 26px;
      line-height: 1.8;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 16px 40px rgba(37,99,235,0.25),
        inset 0 1px 0 rgba(255,255,255,0.15);
    }

    .lyrics-box::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -40px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
    }

    .lyrics-box::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -20px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
    }

    .lyrics-quote {
      position: absolute;
      top: 0;
      left: 16px;
      font-size: 90px;
      color: rgba(255,255,255,0.12);
      line-height: 1;
      user-select: none;
    }

    .lyrics-text {
      position: relative;
      z-index: 1;
    }

    .lyrics-line {
      display: block;
      margin-bottom: 8px;
    }

    .lyrics-line.tamil {
      font-family: 'Noto Sans Tamil', sans-serif;
      font-size: 20px;
      font-weight: 500;
      color: #ffffff;
      line-height: 1.8;
    }

    .lyrics-line.translation {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      font-weight: 300;
      margin-bottom: 12px;
      font-style: italic;
    }

    /* Audio Card */
    .audio-card {
      background: #fff;
      border-radius: 24px;
      padding: 18px 16px 16px;
      margin-bottom: 18px;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow:
        0 6px 20px rgba(0,0,0,0.08);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 6px 18px rgba(37,99,235,0.3);
      transition: .2s;
    }

    .play-btn:hover {
      transform: scale(1.05);
    }

    .play-btn svg {
      fill: #fff;
    }

    /* Waveform */
    .wave {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 34px;
      flex: 1;
    }

    .bar {
      flex: 1;
      border-radius: 10px;
      background: rgba(37,99,235,0.15);
      animation: idle 1.8s ease infinite;
      transform-origin: bottom;
    }

    .bar:nth-child(1) { height: 30%; }
    .bar:nth-child(2) { height: 60%; }
    .bar:nth-child(3) { height: 45%; }
    .bar:nth-child(4) { height: 85%; }
    .bar:nth-child(5) { height: 50%; }
    .bar:nth-child(6) { height: 70%; }
    .bar:nth-child(7) { height: 35%; }
    .bar:nth-child(8) { height: 90%; }
    .bar:nth-child(9) { height: 55%; }
    .bar:nth-child(10){ height: 75%; }

    @keyframes idle {
      0%,100% { opacity: .3; transform: scaleY(1); }
      50% { opacity: .6; transform: scaleY(.65); }
    }

    .wave.playing .bar {
      animation: dance .45s ease infinite alternate;
      background: linear-gradient(to top, #2563eb, #60a5fa);
    }

    @keyframes dance {
      from { transform: scaleY(.3); opacity: .6; }
      to   { transform: scaleY(1); opacity: 1; }
    }

    /* Progress */
    .progress-wrap {
      width: 100%;
      height: 4px;
      border-radius: 20px;
      background: rgba(37,99,235,0.1);
      margin-bottom: 8px;
      cursor: pointer;
    }

    .progress {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      width: 0%;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #6b7280;
    }

    /* Scan Button */
    .scan-btn {
      width: 100%;
      height: 60px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #60a5fa);
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(37,99,235,0.25);
      transition: .2s;
    }

    .scan-btn:hover {
      transform: translateY(-2px);
    }

    /* ── SCANNER OVERLAY (QR) ── */
    .scanner-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 5, 12, 0.92);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 20;
      border-radius: 48px;
      animation: fadeIn .25s ease;
    }
    .scanner-overlay.open { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .scan-overlay-title {
      color: rgba(255,255,255,0.55);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .scanner-box {
      width: 220px; height: 220px;
      border-radius: 18px;
      position: relative;
      margin-bottom: 20px;
    }

    .corner {
      position: absolute;
      width: 24px; height: 24px;
      border-color: #60a5fa;
      border-style: solid;
    }
    .corner.tl { top:0; left:0; border-width:3px 0 0 3px; border-radius:6px 0 0 0; }
    .corner.tr { top:0; right:0; border-width:3px 3px 0 0; border-radius:0 6px 0 0; }
    .corner.bl { bottom:0; left:0; border-width:0 0 3px 3px; border-radius:0 0 0 6px; }
    .corner.br { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 6px 0; }

    .scan-inner {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.015);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .scan-hint {
      color: rgba(255,255,255,0.3);
      font-size: 11px;
      letter-spacing: .1em;
      margin-bottom: 32px;
    }

    .close-btn {
      padding: 12px 36px;
      border: 1.5px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      border-radius: 40px;
      color: rgba(255,255,255,0.75);
      font-size: 14px;
      font-weight: 500;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .close-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.28);
    }
    .close-btn:active { transform: scale(.96); }

    /* Responsive */
    @media (max-width: 420px) {
      .mobile-shell {
        width: 100%;
        border-radius: 32px;
      }
    }
  </style>
</head>

<body>

<div class="mobile-shell">

  <!-- Top Bar -->
  <div class="top-bar">
    
    <span class="top-badge">முன் கோப குயிலே💙 </span>
  </div>

  <!-- Lyrics -->
  <!-- Replace only the lyrics section with this -->

<div class="lyrics-box">
  <span class="lyrics-quote">"</span>

  <div class="lyrics-text">
    <span class="lyrics-line tamil">ஆனால் என்னை</span>
    <span class="lyrics-line tamil">விட்டு போனால் எந்தன்</span>
    <span class="lyrics-line tamil">நிலா சோர்ந்து போகும்</span>
    <span class="lyrics-line tamil">வானின் நீளம் தேய்ந்து</span>
    <span class="lyrics-line tamil">போகுமே</span>
    <span class="lyrics-line tamil">"முன் கோப குயிலே"</span>
  </div>
</div>

  <!-- Audio Card -->
  <div class="audio-card">
    <div class="controls-row">
      <button class="play-btn" id="playBtn" onclick="togglePlay()">
        <svg id="playIcon" width="16" height="16" viewBox="0 0 16 16">
          <polygon points="4,2 14,8 4,14"></polygon>
        </svg>
      </button>

      <div class="wave" id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <audio id="audio">
      <source src="./songs/aruyirey.mpeg" type="audio/mp3">
    </audio>

    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>

    <div class="time-row">
      <span id="elapsed">0:00</span>
      <span id="duration">0:00</span>
    </div>
  </div>

  <!-- Scan Button -->
  <button class="scan-btn" id="scanBtn">
    Scan next page
  </button>

  <!-- SCANNER OVERLAY -->
  <div class="scanner-overlay" id="scanner">
    <div class="scan-overlay-title">Align paper within frame</div>
    <div class="scanner-box">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
      <div class="scan-inner">
        <div id="qr-reader" style="width: 210px; height: 210px; margin: 0 auto;"></div>
      </div>
    </div>
    <div class="scan-hint" id="scanHint">Hold steady · Auto-detects QR</div>
    <button class="close-btn" id="closeBtn">Done</button>
  </div>

</div>

<!-- html5-qrcode CDN -->
<script src="https://unpkg.com/html5-qrcode@2.3.10/html5-qrcode.min.js"></script>
<script>
  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const waveform = document.getElementById('waveform');
  const progress = document.getElementById('progress');
  const elapsed = document.getElementById('elapsed');
  const duration = document.getElementById('duration');

  let isPlaying = false;

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return mins + ':' + (secs < 10 ? '0' : '') + secs;
  }

  audio.addEventListener('loadedmetadata', () => {
    duration.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      const percent = (audio.currentTime / audio.duration) * 100;
      progress.style.width = percent + '%';
      elapsed.textContent = formatTime(audio.currentTime);
    }
  });

  audio.addEventListener('ended', () => {
    isPlaying = false;
    waveform.classList.remove('playing');
    playIcon.innerHTML =
      '<polygon points="4,2 14,8 4,14"></polygon>';
    progress.style.width = '0%';
    elapsed.textContent = '0:00';
  });

  function togglePlay() {
    if (isPlaying) {
      audio.pause();
      waveform.classList.remove('playing');
      playIcon.innerHTML =
        '<polygon points="4,2 14,8 4,14"></polygon>';
    } else {
      audio.play();
      waveform.classList.add('playing');
      playIcon.innerHTML =
        '<rect x="3" y="2" width="4" height="12" rx="1"></rect>' +
        '<rect x="9" y="2" width="4" height="12" rx="1"></rect>';
    }

    isPlaying = !isPlaying;
  }

  // QR Scanner integration
  const scannerOverlay = document.getElementById('scanner');
  const scanBtn = document.getElementById('scanBtn');
  const closeBtn = document.getElementById('closeBtn');
  let html5QrCode = null;

  scanBtn.addEventListener('click', () => {
    scannerOverlay.classList.add('open');
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("qr-reader");
    }
    document.getElementById('scanHint').textContent = 'Hold steady · Auto-detects QR';

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 180, height: 180 } },
      (qrCodeMessage) => {
        document.getElementById('scanHint').textContent = 'QR detected! Redirecting...';
        html5QrCode.stop().then(() => {
          window.location.href = qrCodeMessage;
        });
      },
      () => {}
    ).catch(err => {
      document.getElementById('scanHint').textContent = 'Camera error: ' + err;
    });
  });

  closeBtn.addEventListener('click', () => {
    scannerOverlay.classList.remove('open');
    if (html5QrCode) {
      html5QrCode.stop().catch(() => {});
    }
  });
</script>

</body>
</html>
